name: Build Faeryware APK

on:
  push:
    branches: [main]
    paths:
      - 'faeryware/**'
      - '.github/workflows/faeryware-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build haunted launcher
        working-directory: faeryware/android
        run: gradle :app:assembleDebug --stacktrace
      - name: Stage APK
        run: cp faeryware/android/app/build/outputs/apk/debug/app-debug.apk Faeryware-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Faeryware-debug-apk
          path: Faeryware-debug.apk
      - name: Publish Faeryware release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: faeryware-${{ github.run_number }}
          name: Faeryware Haunted Launcher ${{ github.run_number }}
          make_latest: false
          generate_release_notes: false
          files: Faeryware-debug.apk
          body: |
            Faeryware haunted Android HOME launcher debug APK built from ${{ github.sha }}.

            Resident Haunt v4 includes image-first HOME, Haunt Feed, local scratchpad, app/web search,
            live chibi wallpaper, context-aware widget, Quick Settings haunt tile, draggable resident
            chibi Fae, MINI/BUBBLE/CARD forms, bounded edge companions, Haunt Console, optional
            foreground-app awareness, optional notification-source awareness, and local-only context memory.

            Privacy/safety boundary:
            - no root or device admin
            - no silent HOME takeover
            - no hidden fullscreen intercept
            - Accessibility awareness records foreground package/app label only and cannot retrieve view content
            - Notification awareness records source app + time only, not message bodies
            - no keystrokes, passwords, or other-app touch interception
            - all special access is explicit Android user consent and can be revoked in Settings
