name: Build Faeryware APK

on:
  push:
    branches: [main]
    paths:
      - 'faeryware/**'
      - '.github/workflows/faeryware-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Materialize Digi Fae sticker atlas
        working-directory: faeryware/android
        run: |
          base64 -d app/src/main/res/drawable/faeryware_v5_sticker_atlas.txt > app/src/main/res/drawable/faeryware_v5_sticker_atlas.webp
          rm app/src/main/res/drawable/faeryware_v5_sticker_atlas.txt
      - name: Build haunted overlay colony
        working-directory: faeryware/android
        run: gradle :app:assembleDebug --stacktrace
      - name: Stage APK
        run: cp faeryware/android/app/build/outputs/apk/debug/app-debug.apk Faeryware-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Faeryware-debug-apk
          path: Faeryware-debug.apk
      - name: Publish Faeryware release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: faeryware-${{ github.run_number }}
          name: Faeryware Overlay Colony ${{ github.run_number }}
          make_latest: false
          generate_release_notes: false
          files: Faeryware-debug.apk
          body: |
            Faeryware V5 Overlay Colony debug APK built from ${{ github.sha }}.

            One UI remains the Home launcher. Faeryware lives above it as small explicit overlay windows using Raven-supplied Digi Fae sticker art.

            V5 includes 36 deterministic sticker states, draggable/perchable main resident, bounded companion residents, Home-only or Follow-me scope, CALM/HAUNTED/FERAL/APOCALYPSE levels, Ghost House edge handle, optional context awareness, notification-source awareness, local memory, Quick Settings control, widget, and optional live wallpaper.

            Privacy/safety boundary:
            - no root or device admin
            - does not claim the HOME role
            - no invisible fullscreen overlay
            - residents only consume touch inside their own small windows
            - Accessibility awareness records foreground package/app label only
            - Notification awareness records source app + time only, not message bodies
            - no keystrokes, passwords, or other-app touch interception
            - special access is explicit Android user consent and revocable in Settings
