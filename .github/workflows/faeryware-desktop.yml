name: Build Faeryware Desktop

on:
  workflow_dispatch:
  push:
    paths:
      - "faeryware/desktop/**"
      - "faeryware/shared/**"
      - ".github/workflows/faeryware-desktop.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: faeryware/desktop
    steps:
      - uses: actions/checkout@v4

      - name: Fae Eyes source canary
        shell: pwsh
        run: |
          $rust = (Get-Content src-tauri/src/main.rs -Raw) + (Get-Content src-tauri/src/vision.rs -Raw)
          $habitat = (Get-Content src/habitat.js -Raw) + (Get-Content src/vision-haunt.js -Raw)
          $office = (Get-Content src/office.html -Raw) + (Get-Content src/office.js -Raw)
          @(
            'SetWinEventHook',
            'desktop_windows',
            'window_action',
            'launch_phone_portal',
            'capture_vision_frame',
            'ollama_vision',
            '127.0.0.1:11434',
            'BitBlt',
            'GetDIBits',
            ':cloud'
          ) | ForEach-Object {
            if (-not $rust.Contains($_)) { throw "missing Rust Fae Eyes token: $_" }
          }
          @(
            'faery://vision-result',
            'I CAN SEE THE WHOLE FLOOR',
            'PHONE PORTAL!',
            '18'
          ) | ForEach-Object {
            if (-not $habitat.Contains($_)) { throw "missing habitat vision token: $_" }
          }
          @(
            'PIXEL VISION',
            'LOOK NOW',
            'AUTO LOOK',
            'capture_vision_frame',
            'ollama_vision',
            '👁 LOOK'
          ) | ForEach-Object {
            if (-not $office.Contains($_)) { throw "missing OfficeOS Fae Eyes token: $_" }
          }
          Write-Host "FAERYWARE_FAE_EYES_V08_CANARY=PASS"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run build

      - name: Stage release payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src-tauri/target/release/faeryware-desktop.exe dist/Faeryware-Resident-v0.8.exe
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $nsis) { throw "NSIS installer missing" }
          Copy-Item $nsis.FullName dist/Faeryware-Windows-v0.8-Setup.exe
          Get-FileHash dist/* -Algorithm SHA256 | Format-Table

      - uses: actions/upload-artifact@v4
        with:
          name: Faeryware-Windows-v0.8
          path: faeryware/desktop/dist/*
