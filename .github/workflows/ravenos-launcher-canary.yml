name: RavenOS Launcher Canary

on:
  push:
    branches: [ravenos-launcher]
    paths:
      - 'ravenos-launcher/**'
      - 'faeryware/house/**'
      - '.github/workflows/ravenos-launcher-canary.yml'
  pull_request:
    paths:
      - 'ravenos-launcher/**'
      - 'faeryware/house/**'
      - '.github/workflows/ravenos-launcher-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with pinned launcher chassis
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply RavenOS Launcher overlay
        run: python3 ravenos-launcher/apply-ravenos-overlay.py

      - name: Apply RavenOS ergonomics patch
        run: python3 ravenos-launcher/patch-ravenos-ergonomics.py faeryware/house/iappyxOS-Launcher

      - name: Verify RavenOS identity and haunted runtime hooks
        run: |
          set -euo pipefail
          ROOT='faeryware/house/iappyxOS-Launcher/src/launcher/app/src/main'
          APP='faeryware/house/iappyxOS-Launcher/src/launcher/app'
          grep -R 'RavenOS Launcher' "$ROOT/res/values/strings.xml"
          grep -R 'applicationId "com.ravenos.launcher"' "$APP/build.gradle"
          grep -R 'android:authorities="${applicationId}.provider"' "$ROOT/AndroidManifest.xml"
          grep -R 'RAVENOS OFFICE BAR: persistent visible presence' "$ROOT/AndroidManifest.xml"
          grep -R 'RAVENOS BOOT RESTORE' "$ROOT/AndroidManifest.xml"
          grep -R 'RAVENOS AMBIENT SIGNALS' "$ROOT/AndroidManifest.xml"
          grep -R 'RAVENOS ECOLOGY: token-gated Tasker command receiver' "$ROOT/AndroidManifest.xml"
          grep -R 'com.ravenos.launcher.TASKER_COMMAND' "$ROOT/AndroidManifest.xml"
          grep -R 'android:name=".ravenos.RavenHomeActivity"' "$ROOT/AndroidManifest.xml"
          grep -R 'RAVENOS HOME AURA' "$ROOT/java/com/iappyx/launcher/LauncherActivity.kt"
          grep -R 'RAVENOS HOME WHISPER' "$ROOT/java/com/iappyx/launcher/LauncherActivity.kt"
          grep -R 'RAVENOS ERGONOMICS: persistent Raven edge menu' "$ROOT/java/com/iappyx/launcher/LauncherActivity.kt"
          grep -R 'RAVENOS ERGONOMICS: explicit navigation API' "$ROOT/java/com/iappyx/launcher/LauncherActivity.kt"
          grep -R 'RavenGesturePrefs.fire' "$ROOT/java/com/iappyx/launcher/LauncherActivity.kt"
          grep -R 'RAVENOS OFFICE BAR: initial home signal' "$ROOT/java/com/iappyx/launcher/LauncherActivity.kt"
          grep -R 'RAVENOS OFFICE BAR: app launch signal' "$ROOT/java/com/iappyx/launcher/applock/AppLockManager.kt"
          grep -R 'RAVENOS WIDGET OFFICE BRIDGE' "$ROOT/java/com/iappyx/launcher/cells/GeneratedWidgetCell.kt"
          grep -R 'RavenWidgetOfficeModule.attach' "$ROOT/java/com/iappyx/launcher/cells/GeneratedWidgetCell.kt"
          grep -R 'RAVENOS OFFICE WALLPAPER: state receiver' "$ROOT/java/com/iappyx/launcher/wallpaper/IappyxWallpaperService.kt"
          grep -R 'updateRavenOffice' "$ROOT/java/com/iappyx/launcher/wallpaper/IappyxWallpaperService.kt"
          grep -R 'setRavenOfficeAckEnabled' "$ROOT/java/com/iappyx/launcher/wallpaper/IappyxWallpaperService.kt"
          grep -R 'ravenOfficeAck' "$ROOT/java/com/iappyx/launcher/wallpaper/IappyxWallpaperService.kt"

          # Core haunted runtime
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenOfficeMember.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenEmployeePresentation.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenGoblinVisionOverlay.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenOfficeBarService.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenOfficeGovernor.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenForegroundAwarenessService.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenFollowMeOverlay.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenHomeAura.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenHomeWhisper.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenMenu.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenGesturePrefs.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenHauntMode.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenOfficeTraceStore.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenOfficeStateStore.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenWidgetOfficeBridge.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenWallpaperOfficeAckBridge.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenSurfaceIntegrity.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenAmbientReceiver.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenScreenMonitor.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenAwarenessStatus.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenBootReceiver.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenPermissionDeck.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenCommandRouter.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenSystemDeck.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenSystemDeckPane.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenSurfaceModel.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenIntelligenceProvider.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenHomeActivity.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenAppCatalog.kt"

          # Goblin Vision / EmojiOS / KaomojiOS projection law
          grep -R 'RavenEmployeePresentation.packet' "$ROOT/java/com/iappyx/launcher/ravenos/RavenOfficeBarService.kt"
          grep -R 'RavenGoblinVisionOverlay.render' "$ROOT/java/com/iappyx/launcher/ravenos/RavenOfficeBarService.kt"
          grep -R 'RAVENOS ECOLOGY: unified employee presentation' "$ROOT/java/com/iappyx/launcher/ravenos/RavenHomeActivity.kt"
          grep -R 'GOBLIN VISION' "$ROOT/java/com/iappyx/launcher/ravenos/RavenGoblinVisionOverlay.kt"
          grep -R 'KaomojiOS' "$ROOT/java/com/iappyx/launcher/ravenos/RavenEmployeePresentation.kt"
          grep -R 'no-op compatibility seam' "$ROOT/java/com/iappyx/launcher/ravenos/RavenMorphSurface.kt"
          ! grep -q 'content.addView' "$ROOT/java/com/iappyx/launcher/ravenos/RavenMorphSurface.kt"

          # Haunted ecology wave
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenHauntRequirements.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenOfficeFeed.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenMorphSurface.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenPossessedPopup.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenSummoningWheel.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenGhostHotspots.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenCommandPalette.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenTaskerBridge.kt"
          test -s "$ROOT/java/com/iappyx/launcher/ravenos/RavenTaskerReceiver.kt"
          grep -R 'RAVENOS ECOLOGY: attach morph + ghost hotspots' "$ROOT/java/com/iappyx/launcher/ravenos/RavenHomeActivity.kt"
          grep -R 'RAVENOS ECOLOGY: possessed app popup' "$ROOT/java/com/iappyx/launcher/ravenos/RavenHomeActivity.kt"
          grep -R 'RAVENOS ECOLOGY: command keyboard' "$ROOT/java/com/iappyx/launcher/ravenos/RavenHomeActivity.kt"
          grep -R 'RavenHauntRequirements.evaluateAndSignal' "$ROOT/java/com/iappyx/launcher/ravenos/RavenHomeActivity.kt"
          grep -R 'RavenSummoningWheel.show' "$ROOT/java/com/iappyx/launcher/ravenos/RavenHomeActivity.kt"
          grep -R 'RavenOfficeFeed.show' "$ROOT/java/com/iappyx/launcher/ravenos/RavenHomeActivity.kt"
          grep -R 'RavenTaskerBridge.showSetup' "$ROOT/java/com/iappyx/launcher/ravenos/RavenHomeActivity.kt"
          grep -R 'RavenTaskerBridge.emit' "$ROOT/java/com/iappyx/launcher/ravenos/RavenOfficeBarService.kt"
          grep -R 'RavenTaskerBridge.validToken' "$ROOT/java/com/iappyx/launcher/ravenos/RavenTaskerReceiver.kt"
          grep -R 'RavenCommandRouter.execute' "$ROOT/java/com/iappyx/launcher/ravenos/RavenTaskerReceiver.kt"
          grep -R '#tasker' "$ROOT/java/com/iappyx/launcher/ravenos/RavenCommandPalette.kt"
          test -s 'ravenos-launcher/patch-ravenos-ecology.py'

          # Existing proof contracts
          test -s 'ravenos-launcher/patch-ravenos-wallpaper.py'
          test -s 'ravenos-launcher/patch-ravenos-ergonomics.py'
          grep -R 'APOCALYPSE' "$ROOT/java/com/iappyx/launcher/ravenos/RavenHauntMode.kt"
          grep -R 'RavenOfficeGovernor.accept' "$ROOT/java/com/iappyx/launcher/ravenos/RavenOfficeBarService.kt"
          grep -R 'RavenHomeAura.render' "$ROOT/java/com/iappyx/launcher/ravenos/RavenOfficeBarService.kt"
          grep -R 'RavenHomeWhisper.render' "$ROOT/java/com/iappyx/launcher/ravenos/RavenOfficeBarService.kt"
          grep -R 'RavenOfficeTraceStore.record' "$ROOT/java/com/iappyx/launcher/ravenos/RavenOfficeBarService.kt"
          grep -R 'RavenOfficeStateStore.write' "$ROOT/java/com/iappyx/launcher/ravenos/RavenOfficeBarService.kt"
          grep -R 'RavenWidgetOfficeModule.broadcast' "$ROOT/java/com/iappyx/launcher/ravenos/RavenOfficeStateStore.kt"
          grep -R 'RavenSurfaceIntegrity.OFFICE_BAR' "$ROOT/java/com/iappyx/launcher/ravenos/RavenOfficeBarService.kt"
          grep -R 'RavenSurfaceIntegrity.FOLLOW_ME' "$ROOT/java/com/iappyx/launcher/ravenos/RavenGoblinVisionOverlay.kt"
          grep -R 'markCrossProcess' "$ROOT/java/com/iappyx/launcher/ravenos/RavenSurfaceIntegrity.kt"
          grep -R 'fun acknowledge' "$ROOT/java/com/iappyx/launcher/ravenos/RavenWidgetOfficeBridge.kt"
          grep -R 'ravenOffice.acknowledge' "$ROOT/assets/widgets/ravenos_office.html"
          grep -R 'ravenOfficeAck.acknowledge' "$ROOT/assets/wallpapers/ravenos_office.html"
          grep -R 'SURFACE INTEGRITY' "$ROOT/java/com/iappyx/launcher/ravenos/RavenSystemDeckPane.kt"
          grep -R 'CONSUMED = RavenOS-owned JavaScript' "$ROOT/java/com/iappyx/launcher/ravenos/RavenSystemDeckPane.kt"
          grep -R 'RavenSurfaceIntegrity.compact' "$ROOT/java/com/iappyx/launcher/ravenos/RavenSystemDeckPane.kt"
          grep -R 'RavenScreenMonitor.start' "$ROOT/java/com/iappyx/launcher/ravenos/RavenOfficeBarService.kt"
          test -s 'ravenos-launcher/device-canary.sh'

      - name: Fast Kotlin compile gate
        working-directory: faeryware/house/iappyxOS-Launcher/src/launcher
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Build RavenOS Launcher APK
        working-directory: faeryware/house/iappyxOS-Launcher/src/launcher
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Stage RavenOS Launcher APK
        run: |
          cp faeryware/house/iappyxOS-Launcher/src/launcher/app/build/outputs/apk/debug/app-debug.apk RavenOS-Launcher-debug.apk
          test -s RavenOS-Launcher-debug.apk
          sha256sum RavenOS-Launcher-debug.apk | tee RavenOS-Launcher-debug.sha256

      - name: Verify APK package identity
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT"
          "$AAPT" dump badging RavenOS-Launcher-debug.apk | tee RavenOS-Launcher-badging.txt
          grep -F "package: name='com.ravenos.launcher'" RavenOS-Launcher-badging.txt
          grep -F "application-label:'RavenOS Launcher'" RavenOS-Launcher-badging.txt

      - name: Upload RavenOS Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: RavenOS-Launcher-debug-apk
          path: |
            RavenOS-Launcher-debug.apk
            RavenOS-Launcher-debug.sha256
            RavenOS-Launcher-badging.txt
            ravenos-launcher/device-canary.sh
