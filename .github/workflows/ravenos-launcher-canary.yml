name: RavenOS Launcher Canary

on:
  push:
    branches: [ravenos-launcher, ravenos-launcher-whole-phone]
    paths:
      - 'ravenos-launcher/**'
      - 'faeryware/house/**'
      - '.github/workflows/ravenos-launcher-canary.yml'
  pull_request:
    paths:
      - 'ravenos-launcher/**'
      - 'faeryware/house/**'
      - '.github/workflows/ravenos-launcher-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with pinned launcher chassis
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify recovery authority and Goblin Brain topology
        run: |
          set -euo pipefail
          python3 ravenos-launcher/verify-recovery-manifest.py
          python3 ravenos-launcher/tests/RAVENOS-GOBLIN-BRAIN-WIRING-CANARY.py

      - name: Reconstruct complete RavenOS Launcher
        run: |
          set -euo pipefail
          python3 ravenos-launcher/apply-ravenos-overlay.py
          python3 ravenos-launcher/patch-ravenos-knowledge-widget.py

      - name: Verify complete current runtime
        run: |
          set -euo pipefail
          ROOT='faeryware/house/iappyxOS-Launcher/src/launcher/app/src/main'
          APP='faeryware/house/iappyxOS-Launcher/src/launcher/app'
          R="$ROOT/java/com/iappyx/launcher/ravenos"

          grep -F 'applicationId "com.ravenos.launcher"' "$APP/build.gradle"
          grep -F 'RavenOS Launcher' "$ROOT/res/values/strings.xml"

          # Current whole-phone / SitcomOS / structural-memory / modular-engine crown jewels.
          for f in \
            RavenGoblinBrain.kt RavenGoblinBrainBusOS.kt RavenGoblinEngineOS.kt RavenGoblinModuleRackOS.kt RavenGoblinExtensionRackOS.kt RavenGoblinSurfaceRouterOS.kt RavenGoblinSystemsRegistryOS.kt \
            RavenSitcomDirectorOS.kt RavenMetaMaxShowrunnerOS.kt RavenGoldSitcomTopologyOS.kt \
            RavenOfficeSeasonOS.kt RavenEpisodeOS.kt RavenEpisodeScriptOS.kt RavenBitLedgerOS.kt \
            RavenOfficeRecallOS.kt RavenSceneGraphOS.kt RavenDialogueVaultOS.kt RavenMetaAntiRepeatOS.kt \
            RavenMetaTrickHistoryOS.kt RavenMetaGoblinDialogueOS.kt RavenMetaGrammarOS.kt \
            RavenContextualDialogueBank.kt RavenSitcomDialogueOS.kt RavenLongSeriesDialogueOS.kt \
            RavenGoblinVisionOverlay.kt RavenFollowMeOverlay.kt RavenOfficeFeed.kt RavenOfficeBarService.kt \
            RavenEmployeePresentation.kt RavenSceneExpressionOS.kt RavenEmojiReactionBank.kt \
            RavenKaomojiGrammarOS.kt RavenSystemDeck.kt RavenCommandPalette.kt RavenHomeActivity.kt \
            RavenNotificationSenseOS.kt RavenMediaSessionSenseOS.kt RavenViewportSemanticsOS.kt \
            RavenEmployeeExpressionBridge.kt RavenEmojiKaomojiProjection.kt RavenExpressionSelectorOS.kt \
            RavenKnowledgeBrokerOS.kt RavenKnowledgeWorker.kt RavenWidgetGoblinBrainModule.kt \
            RavenWidgetKnowledgeModule.kt; do
              test -s "$R/$f" || { echo "MISSING_CURRENT_LAUNCHER_ORGAN:$f"; exit 31; }
          done

          # One current event throat, modular Brain engine, one settled reaction packet.
          grep -F 'RavenGoblinEngineOS.react' "$R/RavenOfficeBarService.kt"
          grep -F 'RavenGoblinBrainBusOS.react' "$R/RavenGoblinEngineOS.kt"
          grep -F 'RavenGoblinModuleRackOS' "$R/RavenGoblinEngineOS.kt"
          grep -F 'RavenGoblinSurfaceRouterOS.settle' "$R/RavenGoblinEngineOS.kt"
          grep -F 'RavenGoblinBrain.react' "$R/RavenGoblinBrainBusOS.kt"
          grep -F 'RavenGoblinModuleRackOS.plan' "$R/RavenGoblinBrainBusOS.kt"
          grep -F 'RavenGoblinExtensionRackOS.apply' "$R/RavenGoblinBrainBusOS.kt"
          grep -F 'MODULE_RACK' "$R/RavenGoblinSystemsRegistryOS.kt"
          grep -F 'LATE_EXTENSION_RACK' "$R/RavenGoblinSystemsRegistryOS.kt"
          grep -F 'RavenReactionStateStore.write' "$R/RavenGoblinSurfaceRouterOS.kt"
          grep -F 'RavenWidgetGoblinBrainModule.broadcast' "$R/RavenReactionStateStore.kt"
          grep -F 'RavenEmployeeExpressionBridge.decorate' "$R/RavenEmployeePresentation.kt"
          grep -F 'RavenWidgetGoblinBrainModule.attach' "$R/RavenWidgetOfficeBridge.kt"
          grep -F 'RavenWidgetKnowledgeModule.attach' "$R/RavenWidgetOfficeBridge.kt"

          # Current screen-first law must survive recovery.
          grep -F 'RavenPresentationArbiterOS.decide' "$R/RavenGoblinBrain.kt"
          grep -F 'RavenScreenAwareDialogueOS.select' "$R/RavenGoblinBrain.kt"
          grep -F 'PHONE_REPEAT_SILENT' "$R/RavenPresentationArbiterOS.kt"
          grep -F 'RavenSitcomDirectorOS' "$R/RavenGoblinBrain.kt"
          grep -F 'RavenMetaMaxShowrunnerOS' "$R/RavenGoblinBrain.kt"
          grep -F 'RavenGoldSitcomTopologyOS' "$R/RavenGoblinBrain.kt"

      - name: Run unit tests and Kotlin compile gate
        working-directory: faeryware/house/iappyxOS-Launcher/src/launcher
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:compileDebugKotlin --stacktrace --console=plain

      - name: Build RavenOS Launcher APK
        working-directory: faeryware/house/iappyxOS-Launcher/src/launcher
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Stage RavenOS Launcher APK
        run: |
          cp faeryware/house/iappyxOS-Launcher/src/launcher/app/build/outputs/apk/debug/app-debug.apk RavenOS-Launcher-debug.apk
          test -s RavenOS-Launcher-debug.apk
          sha256sum RavenOS-Launcher-debug.apk | tee RavenOS-Launcher-debug.sha256

      - name: Verify APK runtime and package identity
        run: |
          set -euo pipefail
          python3 ravenos-launcher/verify-built-apk-runtime.py RavenOS-Launcher-debug.apk --require-next-wave
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT"
          "$AAPT" dump badging RavenOS-Launcher-debug.apk | tee RavenOS-Launcher-badging.txt
          grep -F "package: name='com.ravenos.launcher'" RavenOS-Launcher-badging.txt
          grep -F "application-label:'RavenOS Launcher'" RavenOS-Launcher-badging.txt

      - name: Upload RavenOS Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: RavenOS-Launcher-debug-apk
          path: |
            RavenOS-Launcher-debug.apk
            RavenOS-Launcher-debug.sha256
            RavenOS-Launcher-badging.txt
            ravenos-launcher/APK-BINARY-RECOVERY-MANIFEST-1a660aea.json
            ravenos-launcher/verify-built-apk-runtime.py
            ravenos-launcher/UPGRADE-RECOVERY-MANIFEST.json
            ravenos-launcher/docs/RECOVERY-INDEX.md
            ravenos-launcher/device-canary.sh
