name: RavenOS Recovered Tests Diagnostic

on:
  push:
    branches: [ravenos-launcher-recovery-integration-20260912]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate-recovered-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Reconstruct recovered launcher
        run: |
          set -euo pipefail
          python3 ravenos-launcher/verify-recovery-manifest.py
          python3 ravenos-launcher/tests/RAVENOS-GOBLIN-BRAIN-WIRING-CANARY.py
          python3 ravenos-launcher/apply-ravenos-overlay.py
          python3 ravenos-launcher/patch-ravenos-knowledge-widget.py
          TESTSRC='faeryware/house/iappyxOS-Launcher/src/launcher/app/src/test/java/com/iappyx/launcher/ravenos'
          mkdir -p /tmp/ravenos-recovered-tests
          cp "$TESTSRC"/*.kt /tmp/ravenos-recovered-tests/

      - name: Test RavenDialogueTrickDeckTest
        working-directory: faeryware/house/iappyxOS-Launcher/src/launcher
        run: |
          set -euo pipefail
          T='app/src/test/java/com/iappyx/launcher/ravenos'
          rm -rf app/src/test
          mkdir -p "$T"
          cp /tmp/ravenos-recovered-tests/RavenDialogueTrickDeckTest.kt "$T/"
          ./gradlew :app:testDebugUnitTest --tests com.iappyx.launcher.ravenos.RavenDialogueTrickDeckTest --rerun-tasks --stacktrace --console=plain

      - name: Test RavenEmojiKaomojiProjectionTest
        if: always()
        working-directory: faeryware/house/iappyxOS-Launcher/src/launcher
        run: |
          set -euo pipefail
          T='app/src/test/java/com/iappyx/launcher/ravenos'
          rm -rf app/src/test
          mkdir -p "$T"
          cp /tmp/ravenos-recovered-tests/RavenEmojiKaomojiProjectionTest.kt "$T/"
          ./gradlew :app:testDebugUnitTest --tests com.iappyx.launcher.ravenos.RavenEmojiKaomojiProjectionTest --rerun-tasks --stacktrace --console=plain

      - name: Test RavenEmployeeExpressionBridgeTest
        if: always()
        working-directory: faeryware/house/iappyxOS-Launcher/src/launcher
        run: |
          set -euo pipefail
          T='app/src/test/java/com/iappyx/launcher/ravenos'
          rm -rf app/src/test
          mkdir -p "$T"
          cp /tmp/ravenos-recovered-tests/RavenEmployeeExpressionBridgeTest.kt "$T/"
          ./gradlew :app:testDebugUnitTest --tests com.iappyx.launcher.ravenos.RavenEmployeeExpressionBridgeTest --rerun-tasks --stacktrace --console=plain

      - name: Test RavenExpressionMetaCanaryTest
        if: always()
        working-directory: faeryware/house/iappyxOS-Launcher/src/launcher
        run: |
          set -euo pipefail
          T='app/src/test/java/com/iappyx/launcher/ravenos'
          rm -rf app/src/test
          mkdir -p "$T"
          cp /tmp/ravenos-recovered-tests/RavenExpressionMetaCanaryTest.kt "$T/"
          ./gradlew :app:testDebugUnitTest --tests com.iappyx.launcher.ravenos.RavenExpressionMetaCanaryTest --rerun-tasks --stacktrace --console=plain

      - name: Test RavenExpressionMetaSystemsTest
        if: always()
        working-directory: faeryware/house/iappyxOS-Launcher/src/launcher
        run: |
          set -euo pipefail
          T='app/src/test/java/com/iappyx/launcher/ravenos'
          rm -rf app/src/test
          mkdir -p "$T"
          cp /tmp/ravenos-recovered-tests/RavenExpressionMetaSystemsTest.kt "$T/"
          ./gradlew :app:testDebugUnitTest --tests com.iappyx.launcher.ravenos.RavenExpressionMetaSystemsTest --rerun-tasks --stacktrace --console=plain

      - name: Test RavenMetaDialogueEngineTest
        if: always()
        working-directory: faeryware/house/iappyxOS-Launcher/src/launcher
        run: |
          set -euo pipefail
          T='app/src/test/java/com/iappyx/launcher/ravenos'
          rm -rf app/src/test
          mkdir -p "$T"
          cp /tmp/ravenos-recovered-tests/RavenMetaDialogueEngineTest.kt "$T/"
          ./gradlew :app:testDebugUnitTest --tests com.iappyx.launcher.ravenos.RavenMetaDialogueEngineTest --rerun-tasks --stacktrace --console=plain

      - name: Main Kotlin compile after isolated tests
        if: always()
        working-directory: faeryware/house/iappyxOS-Launcher/src/launcher
        run: ./gradlew :app:compileDebugKotlin --rerun-tasks --stacktrace --console=plain
