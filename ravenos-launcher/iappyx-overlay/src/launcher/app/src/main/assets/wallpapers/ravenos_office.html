<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>RavenOS Office Field</title>
<style>
  html,body,canvas { width:100%; height:100%; margin:0; overflow:hidden; background:#07050c; }
  body { position:relative; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:white; }
  canvas { position:absolute; inset:0; }
  #resident { position:absolute; right:6vw; top:10vh; text-align:right; pointer-events:none; user-select:none; opacity:.82; text-shadow:0 0 26px var(--accent,#ff4fa3); }
  #emoji { font-size:clamp(52px,13vw,112px); line-height:.9; filter:drop-shadow(0 0 22px var(--accent,#ff4fa3)); }
  #owner { margin-top:10px; font-weight:900; font-size:clamp(19px,4.8vw,38px); letter-spacing:.16em; }
  #lane { margin-top:5px; font-size:clamp(8px,2vw,13px); letter-spacing:.16em; opacity:.53; }
  #note { position:absolute; left:7vw; right:7vw; bottom:12vh; font-size:clamp(12px,3vw,20px); font-weight:650; line-height:1.35; letter-spacing:.02em; opacity:.30; text-shadow:0 0 18px var(--accent,#ff4fa3); pointer-events:none; max-width:78vw; }
  #status { position:absolute; left:7vw; bottom:8.2vh; font-size:9px; letter-spacing:.18em; opacity:.26; text-transform:uppercase; pointer-events:none; }
</style>
</head>
<body>
<canvas id="field"></canvas>
<div id="resident"><div id="emoji">🐦‍⬛</div><div id="owner">RAVENOS</div><div id="lane">OFFICE FIELD</div></div>
<div id="note">The office is waiting for a canonical state.</div>
<div id="status">HAUNTED · HOME</div>
<script>
(() => {
  const canvas=document.getElementById('field'), ctx=canvas.getContext('2d',{alpha:false});
  const emojiEl=document.getElementById('emoji'), ownerEl=document.getElementById('owner'), laneEl=document.getElementById('lane'), noteEl=document.getElementById('note'), statusEl=document.getElementById('status');
  let w=1,h=1,dpr=1,last=0,pageOffset=.5;
  let state={owner:'RAVENOS',emoji:'🐦‍⬛',accent:'#ff4fa3',lane:'OFFICE FIELD',signal:'HOME',note:'The office is waiting for a canonical state.',haunt:'HAUNTED'};
  let particles=[];
  const profile={CALM:{count:10,speed:.10,glow:.18,lines:6,fps:10},LIVED_IN:{count:16,speed:.16,glow:.24,lines:8,fps:12},HAUNTED:{count:24,speed:.24,glow:.34,lines:10,fps:18},FERAL:{count:36,speed:.38,glow:.46,lines:14,fps:24},APOCALYPSE:{count:52,speed:.58,glow:.62,lines:18,fps:30}};
  function cssAccent(v){ if(/^#[0-9a-f]{8}$/i.test(v||'')) return '#'+v.slice(3); if(/^#[0-9a-f]{6}$/i.test(v||'')) return v; return '#ff4fa3'; }
  function rgb(hex){const n=parseInt(hex.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
  function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.max(1,Math.floor(w*dpr));canvas.height=Math.max(1,Math.floor(h*dpr));canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);reseed();}
  function reseed(){const p=profile[state.haunt]||profile.HAUNTED;particles=Array.from({length:p.count},(_,i)=>({x:(Math.sin(i*91.77+13)*.5+.5)*w,y:(Math.sin(i*37.31+7)*.5+.5)*h,vx:(Math.sin(i*13.1)*.5)*p.speed,vy:(Math.cos(i*11.7)*.5)*p.speed,r:1+(i%5)*.55,phase:i*.73}));}
  function acknowledge(next){
    try {
      if(next&&next.updatedAt&&window.ravenOfficeAck&&typeof window.ravenOfficeAck.acknowledge==='function') window.ravenOfficeAck.acknowledge(String(next.updatedAt));
    } catch(_) {}
  }
  function apply(next){
    if(!next||!next.owner)return;
    state={...state,...next};
    const accent=cssAccent(state.accent);document.documentElement.style.setProperty('--accent',accent);
    emojiEl.textContent=state.emoji||'✦';ownerEl.textContent=state.owner||'OFFICE';laneEl.textContent=state.lane||'OFFICE';noteEl.textContent=state.note||'Still here.';statusEl.textContent=`${state.haunt||'HAUNTED'} · ${state.signal||'HOME'}`;
    reseed();
    acknowledge(state);
  }
  function draw(now){
    requestAnimationFrame(draw);const p=profile[state.haunt]||profile.HAUNTED;if(now-last<1000/p.fps)return;const dt=Math.min(48,now-last||16);last=now;const accent=cssAccent(state.accent),[r,g,b]=rgb(accent),drift=(pageOffset-.5)*w*.045;
    const bg=ctx.createRadialGradient(w*(.72+pageOffset*.08),h*.20,10,w*.52,h*.48,Math.max(w,h));bg.addColorStop(0,`rgba(${r},${g},${b},${p.glow})`);bg.addColorStop(.38,`rgba(${Math.floor(r*.32)},${Math.floor(g*.32)},${Math.floor(b*.32)},.34)`);bg.addColorStop(1,'#05040a');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
    ctx.lineWidth=1;for(let i=0;i<p.lines;i++){const y=(i+1)*h/(p.lines+1),wave=Math.sin(now*.00025+i*.8)*12;ctx.strokeStyle=`rgba(${r},${g},${b},${.025+(i%3)*.014})`;ctx.beginPath();ctx.moveTo(0,y+wave);ctx.bezierCurveTo(w*.3,y-wave+drift,w*.7,y+wave+drift,w,y-wave);ctx.stroke();}
    for(const q of particles){q.x+=(q.vx*p.speed*dt)+drift*.0007;q.y+=q.vy*p.speed*dt;if(q.x<-20)q.x=w+20;if(q.x>w+20)q.x=-20;if(q.y<-20)q.y=h+20;if(q.y>h+20)q.y=-20;const a=.18+.16*Math.sin(now*.0015+q.phase);ctx.fillStyle=`rgba(${r},${g},${b},${Math.max(.04,a)})`;ctx.shadowColor=accent;ctx.shadowBlur=state.haunt==='APOCALYPSE'?16:8;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fill();}ctx.shadowBlur=0;
  }
  window.addEventListener('ravenofficechange',e=>apply(e.detail));window.addEventListener('resize',resize);
  if(window.ravenOfficeState)apply(window.ravenOfficeState);
  if(window.iappyx){const oldOffset=window.iappyx.onPageOffset;window.iappyx.onPageOffset=x=>{pageOffset=Number(x)||0;if(typeof oldOffset==='function')oldOffset(x);};}
  resize();requestAnimationFrame(draw);
})();
</script>
</body>
</html>
