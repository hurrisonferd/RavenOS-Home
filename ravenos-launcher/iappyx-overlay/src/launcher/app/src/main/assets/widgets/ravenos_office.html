<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<meta name="iappyx-widget" content="pause" />
<title>RavenOS Office</title>
<style>
  :root { --accent:#ff4fa3; --accent-soft:rgba(255,79,163,.24); --fg:#fff; --muted:rgba(255,255,255,.72); --panel:rgba(8,7,14,.74); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; margin:0; background:transparent; overflow:hidden; }
  body { color:var(--fg); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; display:flex; align-items:stretch; justify-content:stretch; }
  .card { width:100%; height:100%; min-height:120px; position:relative; overflow:hidden; padding:16px 17px 14px; border:1px solid color-mix(in srgb,var(--accent) 55%,transparent); border-radius:24px; background:radial-gradient(circle at 88% 12%,var(--accent-soft),transparent 34%),linear-gradient(145deg,rgba(255,255,255,.08),transparent 34%),var(--panel); box-shadow:inset 0 0 34px color-mix(in srgb,var(--accent) 12%,transparent); }
  .scan { position:absolute; inset:0; pointer-events:none; opacity:.12; background:repeating-linear-gradient(180deg,transparent 0 5px,var(--accent) 6px,transparent 7px); mask-image:linear-gradient(to bottom,transparent,#000 20%,#000 80%,transparent); }
  .top { display:flex; align-items:center; gap:9px; min-width:0; }
  .emoji { font-size:27px; filter:drop-shadow(0 0 10px var(--accent)); }
  .owner { font-weight:850; font-size:20px; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pulse { margin-left:auto; width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 14px var(--accent); }
  .note { margin-top:13px; font-size:15px; line-height:1.34; font-weight:620; text-wrap:balance; }
  .meta { margin-top:12px; display:flex; flex-wrap:wrap; gap:6px; font-size:10px; letter-spacing:.10em; text-transform:uppercase; color:var(--muted); }
  .pill { padding:4px 7px; border:1px solid rgba(255,255,255,.13); border-radius:999px; background:rgba(0,0,0,.15); }
  .empty { opacity:.72; font-size:13px; line-height:1.35; }
  .feral .scan,.apocalypse .scan { animation:drift 6s linear infinite; }
  .apocalypse .pulse { animation:pulse 1.15s ease-in-out infinite; }
  @keyframes pulse { 50% { transform:scale(1.8); opacity:.48; } }
  @keyframes drift { from { transform:translateY(-12px); } to { transform:translateY(12px); } }
</style>
</head>
<body>
  <main id="card" class="card">
    <div class="scan"></div>
    <div id="empty" class="empty">RavenOS Office is waiting for a canonical state.</div>
    <section id="content" hidden>
      <div class="top"><div id="emoji" class="emoji">💗</div><div id="owner" class="owner">KYU</div><div class="pulse"></div></div>
      <div id="note" class="note"></div>
      <div class="meta"><span id="lane" class="pill"></span><span id="signal" class="pill"></span><span id="haunt" class="pill"></span></div>
    </section>
  </main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const card = $('card'), content = $('content'), empty = $('empty');
  function parseAccent(value) {
    if (typeof value !== 'string') return '#ff4fa3';
    if (/^#[0-9a-f]{8}$/i.test(value)) return '#' + value.slice(3);
    if (/^#[0-9a-f]{6}$/i.test(value)) return value;
    return '#ff4fa3';
  }
  function acknowledge(state) {
    try {
      if (state && state.updatedAt && window.ravenOffice && typeof window.ravenOffice.acknowledge === 'function') {
        window.ravenOffice.acknowledge(String(state.updatedAt));
      }
    } catch (_) {}
  }
  function render(state) {
    if (!state || state.ok === false || !state.owner) return;
    empty.hidden = true; content.hidden = false;
    const accent = parseAccent(state.accent);
    document.documentElement.style.setProperty('--accent', accent);
    document.documentElement.style.setProperty('--accent-soft', `color-mix(in srgb,${accent} 24%,transparent)`);
    $('emoji').textContent = state.emoji || '✦';
    $('owner').textContent = state.owner || 'OFFICE';
    $('note').textContent = state.note || 'Still here.';
    $('lane').textContent = state.lane || 'OFFICE';
    $('signal').textContent = state.signal || 'HOME';
    $('haunt').textContent = state.haunt || 'HAUNTED';
    card.className = 'card ' + String(state.haunt || 'haunted').toLowerCase();
    acknowledge(state);
  }
  function boot() {
    try {
      if (window.ravenOffice && typeof window.ravenOffice.state === 'function') render(JSON.parse(window.ravenOffice.state()));
    } catch (_) {}
  }
  window.addEventListener('ravenofficechange', event => render(event.detail));
  boot();
})();
</script>
</body>
</html>
