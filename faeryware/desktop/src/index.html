<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Faeryware // Ghost House</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main id="resident" data-pose="idle">
  <div class="eyebrow">FAERYWARE // GHOST HOUSE</div>
  <div id="speech">hehe. still here.</div>
  <div id="sticker" aria-hidden="true"></div>
  <img id="bodyImg" draggable="false" alt="Digi Fae resident">
  <div id="sigil">♡</div>

  <section id="house">
    <div class="title">DESKTOP COLONY CONTROL</div>
    <div id="faeRow"></div>
    <div class="row">
      <button data-haunt="CALM">CALM</button>
      <button data-haunt="HAUNTED">HAUNTED</button>
      <button data-haunt="FERAL">FERAL</button>
    </div>
    <div class="row">
      <button id="habitat">SUMMON HABITAT</button>
      <button id="office">OFFICEOS / FAE EYES</button>
    </div>
    <div class="row">
      <button id="phone">PHONE PORTAL</button>
      <button id="autostart">AUTOSTART: …</button>
    </div>
    <div class="row">
      <button id="pass">OVERLAY CLICK-THROUGH</button>
      <button id="perch">PERCH HOUSE</button>
      <button id="hideVisuals">BANISH VISUALS</button>
    </div>
    <div id="contextLine">WINDOW WATCH // EVENT DRIVEN</div>
    <small>Ghost House can close while the colony stays resident in the tray. No document text, keystrokes, or screen pixels are read by default.</small>
  </section>
</main>
<script src="assets/kyu.js"></script>
<script src="assets/paimon.js"></script>
<script src="assets/luma.js"></script>
<script src="assets/nyx.js"></script>
<script src="assets/sylph.js"></script>
<script src="assets/qira.js"></script>
<script src="assets/sticker-atlas.js"></script>
<script src="app.js"></script>
</body>
</html>
